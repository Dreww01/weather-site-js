<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="app-header">
      <h1 class="app-title">🌤️ Weather Forecast</h1>
      <p class="app-subtitle">Get real-time weather data for any city</p>
    </header>
    <main>
      <div class="card">
        <div class="title">WEATHER APP</div>
        <section class="search">
          <input type="text" placeholder="Enter city name" spellcheck="false" />
          <button><img src="images/search.png" alt="Search Icon" /></button>
        </section>
        <div class="error">
          <p>Invalid city name, Please enter a valid city name</p>
        </div>

        <!-- This is the container for weather details -->
        <section class="weather">
          <img
            src="images/raining.png"
            class="weather-icon"
            alt="Weather Icon"
          />
          <h1 class="temp">22°C</h1>
          <h2 class="city">New York</h2>
          <div class="details">
            <div class="col">
              <img src="images/humidity.png" alt="Humidity Icon" />
              <div>
                <p class="humidity">50%</p>
                <p>Humidity</p>
              </div>
            </div>
            <div class="col">
              <img src="images/wind.png" alt="Wind Icon" />
              <div>
                <p class="wind">15 km/h</p>
                <p>Wind Speed</p>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
    <script src="script.js" defer></script>
  </body>
</html>
